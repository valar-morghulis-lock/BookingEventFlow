server:
  port: ${RESERVATION_SERVICE_PORT:8082}

spring:
  datasource:
    url: ${RESERVATION_DB_URL}
    username: ${RESERVATION_DB_USERNAME}
    password: ${RESERVATION_DB_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

logging:
  level:
    com.bookingeventflow.reservation: DEBUG
    org.hibernate.orm.jdbc.batch: TRACE