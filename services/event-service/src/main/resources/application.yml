spring:
  application:
    name: event-service

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${CUSTOMER_SERVICE_JWKS_URI}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus

  endpoint:
    health:
      probes:
        enabled: true

  metrics:
    distribution:
      slo:
        events.list.duration: 10ms,25ms,50ms,100ms,250ms,500ms,1s,2s