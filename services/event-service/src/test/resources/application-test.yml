spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    # Testcontainers will override these with dynamic properties
    url: jdbc:postgresql://localhost:5432/testdb
    username: test
    password: test

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  sql:
    init:
      mode: never

  # Testcontainers configuration
  testcontainers:
    reuse:
      enable: true
    ryuk:
      disabled: false

# Docker configuration for Testcontainers
docker:
  host: npipe:////./pipe/dockerDesktopLinuxEngine

# Logging for debugging
logging:
  level:
    org.testcontainers: DEBUG
    com.github.dockerjava: DEBUG
    org.springframework.boot.test: DEBUG
    org.flywaydb: DEBUG
    org.hibernate: INFO