name: booking-event-flow

services:

  event-service-db:
    image: postgres:${POSTGRES_VERSION:-17}
    container_name: booking-event-flow-event-db

    restart: unless-stopped

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

    environment:
      POSTGRES_DB: ${EVENT_DB_NAME}
      POSTGRES_USER: ${EVENT_DB_USERNAME}
      POSTGRES_PASSWORD: ${EVENT_DB_PASSWORD}

    ports:
      - "${EVENT_DB_PORT:-5432}:5432"

    volumes:
      - event-service-db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${EVENT_DB_USERNAME} -d ${EVENT_DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - booking-event-flow-network

  kafka:
    image: apache/kafka:${KAFKA_VERSION:-3.8.0}
    container_name: booking-event-flow-kafka

    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}

    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - booking-event-flow-network

  kafka-connect:
    image: debezium/connect:${DEBEZIUM_VERSION:-2.7.3.Final}
    container_name: booking-event-flow-kafka-connect

    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy
      event-service-db:
        condition: service_healthy

    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: booking-eventflow-connect
      CONFIG_STORAGE_TOPIC: booking-eventflow-connect-configs
      OFFSET_STORAGE_TOPIC: booking-eventflow-connect-offsets
      STATUS_STORAGE_TOPIC: booking-eventflow-connect-status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

    ports:
      - "${KAFKA_CONNECT_PORT:-8083}:8083"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:8083/connectors"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - booking-event-flow-network

  kafka-ui:
    image: provectuslabs/kafka-ui:${KAFKA_UI_VERSION:-latest}
    container_name: booking-event-flow-kafka-ui

    restart: unless-stopped

    depends_on:
      kafka:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy

    environment:
      KAFKA_CLUSTERS_0_NAME: booking-eventflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083

    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"

    networks:
      - booking-event-flow-network

volumes:

  event-service-db-data:
  kafka-data:

networks:

  booking-event-flow-network:
    driver: bridge