services:

  reservation-service-db:
    image: postgres:${POSTGRES_VERSION:-17}
    container_name: booking-event-flow-reservation-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${RESERVATION_DB_NAME}
      POSTGRES_USER: ${RESERVATION_DB_USERNAME}
      POSTGRES_PASSWORD: ${RESERVATION_DB_PASSWORD}

    ports:
      - "${RESERVATION_DB_PORT:-5433}:5432"

    volumes:
      - reservation-service-db-data:/var/lib/postgresql/data
      - ../../../postgres/reservation-service:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${RESERVATION_DB_USERNAME} -d ${RESERVATION_DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - booking-event-flow-network

  reservation-service:
    build:
      context: ../../../..
      dockerfile: services/reservation-service/Dockerfile
    container_name: booking-event-flow-reservation-service

    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: docker
      RESERVATION_DB_NAME: ${RESERVATION_DB_NAME}
      RESERVATION_DB_USERNAME: ${RESERVATION_DB_USERNAME}
      RESERVATION_DB_PASSWORD: ${RESERVATION_DB_PASSWORD}
      RESERVATION_SERVICE_PORT: 8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    ports:
      - "${RESERVATION_SERVICE_PORT:-8082}:8082"

    depends_on:
      reservation-service-db:
        condition: service_healthy

    networks:
      - booking-event-flow-network

volumes:

  reservation-service-db-data:

networks:

  booking-event-flow-network:
    external: true